spring:
  application:
    name: ${SPRING_APPLICATION_NAME:batch-rates-consolidation}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/batch_rates}
    username: ${DB_USERNAME:batch_rates}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
      table-prefix: BATCH_
      isolation-level-for-create: SERIALIZABLE
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:batch-rates-workers}
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: org.springframework.batch
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true

batch:
  chunk-size: ${BATCH_CHUNK_SIZE:100}
  fee:
    default: ${BATCH_DEFAULT_FEE:1.00}
  partition:
    grid-size: ${BATCH_GRID_SIZE:1}
  kafka:
    enabled: ${BATCH_KAFKA_ENABLED:false}
    requests-topic: ${BATCH_REQUESTS_TOPIC:batch-requests}
    replies-topic: ${BATCH_REPLIES_TOPIC:batch-replies}
    dlt:
      backoff-interval: ${BATCH_KAFKA_DLT_BACKOFF_INTERVAL:1000}
      retry-limit: ${BATCH_KAFKA_DLT_RETRY_LIMIT:2}
  exemption:
    base-url: ${EXEMPTION_API_BASE_URL:http://localhost:8090}
    path: ${EXEMPTION_API_PATH:/exemptions/{endToEndId}}
    connect-timeout: ${EXEMPTION_CONNECT_TIMEOUT:200ms}
    read-timeout: ${EXEMPTION_READ_TIMEOUT:1s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
