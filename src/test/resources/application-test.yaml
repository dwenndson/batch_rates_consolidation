spring:
  datasource:
    url: jdbc:h2:mem:batch_rates;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  batch:
    jdbc:
      initialize-schema: always
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
